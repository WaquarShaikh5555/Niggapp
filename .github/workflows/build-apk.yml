name: Build SmileBeat APK

on:
  push:
    branches:
      - main
      - arena/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle Wrapper if missing
        run: |
          ls -la gradle/wrapper/ || echo "no wrapper dir"
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper JAR missing, generating via gradle wrapper..."
            gradle wrapper --gradle-version 8.7
            ls -lh gradle/wrapper/
          fi
          chmod +x gradlew || true
          ls -lh gradle/wrapper/

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace
        # fallback to gradle if wrapper fails
        continue-on-error: false

      - name: Check APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmileBeat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SmileBeat APK - Build ${{ github.run_number }}
          body: |
            **SmileBeat Debug APK - Direct Download for Phone**

            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Min SDK 26 (Android 8.0+)

            **Privacy:** 100% on-device, no upload, no face storage. Camera stays on device.

            **Install:**
            1. Download app-debug.apk below on your phone
            2. Tap file -> Allow install from unknown sources if prompted
            3. Open app -> Grant camera -> VIBE READY

            **Features:**
            - Front camera default, flip button
            - On-device face detection (ML Kit) + HSV tone analysis
            - Triggers phonk track when tone <= threshold for 5 frames
            - Volume, threshold, cooldown, track picker in Settings
            - Dark neon UI with Tone Meter

            **Audio:** Bundled tracks are original synthetic royalty-free phonk (Miguel-inspired dark R&B/phonk). Replace with your licensed tracks in res/raw.

            Built via GitHub Actions - no PC needed!
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
