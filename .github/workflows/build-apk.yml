name: Build SmileBeat APK

on:
  push:
    branches:
      - main
      - arena/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK - accept licenses and install platforms
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" "platforms;android-33" "build-tools;33.0.1" || true
          sdkmanager --list_installed

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        id: build
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log
          echo "Build exit code: ${PIPESTATUS[0]}"
          exit ${PIPESTATUS[0]}

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            app/build/reports/
            app/build/outputs/logs/
          retention-days: 7

      - name: Check APK exists
        if: success()
        run: |
          ls -lh app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SmileBeat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SmileBeat APK - Build ${{ github.run_number }}
          body: |
            **SmileBeat Debug APK - Direct Download for Phone**

            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Min SDK 26 (Android 8.0+)

            **Privacy:** 100% on-device, no upload, no face storage.

            **Install:**
            1. Download app-debug.apk below
            2. Tap file -> Allow install from unknown sources
            3. Grant camera -> VIBE READY

            **Tracks:** 3 bundled Miguel-inspired phonk (original synthetic royalty-free):
            - phonk_vibe_01 (15s classic phonk)
            - midnight_phonk (14s)
            - miguel_nights (16s dark R&B phonk)

            Built via GitHub Actions - no PC needed!
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
