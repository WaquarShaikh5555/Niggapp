name: Build SmileBeat APK

on:
  push:
    branches:
      - main
      - arena/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK - accept licenses and install platforms
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || true
          # Accept licenses
          yes | sdkmanager --licenses || true
          # Install required platforms and build tools
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "platform-tools" "platforms;android-33" "build-tools;33.0.1" || true
          sdkmanager --list_installed | head -n 100

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Generate Gradle Wrapper if missing
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Wrapper JAR missing, generating..."
            gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ls -lh gradle/wrapper/
          ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Check APK exists
        run: |
          ls -lh app/build/outputs/apk/debug/
          du -h app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmileBeat-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: SmileBeat APK - Build ${{ github.run_number }}
          body: |
            **SmileBeat Debug APK - Direct Download for Phone**

            - Branch: ${{ github.ref_name }}
            - Commit: ${{ github.sha }}
            - Min SDK 26 (Android 8.0+)

            **Privacy:** 100% on-device, no upload, no face storage. Camera stays on device.

            **Install:**
            1. Download app-debug.apk below on your phone
            2. Tap file -> Allow install from unknown sources if prompted
            3. Open app -> Grant camera -> VIBE READY

            **Features:**
            - Front camera default, flip button
            - On-device face detection (ML Kit) + HSV tone analysis
            - Triggers phonk track when tone <= threshold for 5 frames
            - Volume, threshold, cooldown, track picker in Settings
            - Dark neon UI with Tone Meter
            - 3 bundled Miguel-inspired phonk tracks: phonk_vibe_01, midnight_phonk, miguel_nights (original synthetic royalty-free)

            Built via GitHub Actions - no PC needed! Download from Assets below.
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
