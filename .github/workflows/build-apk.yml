name: Build UNDO APK

on:
  push:
    branches:
      - main
      - arena/*
  workflow_dispatch:

concurrency:
  group: undo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0 platform-tools'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # Keep one signing key across builds so a new APK installs over the old one
      # (and UNDO keeps your local history). The key never leaves the CI cache.
      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: undo-sideload-keystore-v1

      - name: Unit tests (classification, payment parsing, prioritisation)
        run: gradle :app:testFullReleaseUnitTest --no-daemon --stacktrace 2>&1 | tee test.log; exit ${PIPESTATUS[0]}

      - name: Build release APK
        run: gradle :app:assembleFullRelease :app:assembleLiteRelease --no-daemon --stacktrace 2>&1 | tee build.log; exit ${PIPESTATUS[0]}

      - name: Failure summary
        if: failure()
        run: |
          grep -hE '^e: |error:|FAILED|What went wrong|Exception|^> |expected:' test.log build.log 2>/dev/null \
            | grep -vE '^\s+at |^> Task|^> Run with|^> Get more' | sed -E 's#file://[^ ]*/app/src/(main|test)/java/app/undo/##' | awk '!seen[$0]++' | head -150 > errs.txt || true
          echo '## Build failure' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY; cat errs.txt >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY
          split -l 15 errs.txt chunk_ || true
          for f in chunk_*; do [ -s "$f" ] && echo "::error title=$f::$(sed -e 's/%/%25/g' "$f" | sed -e ':a;N;$!ba;s/\n/%0A/g')"; done

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

      - name: Rename APK
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk UNDO-${{ github.run_number }}.apk
          cp app/build/outputs/apk/lite/release/app-lite-release.apk UNDO-Lite-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UNDO-apk-${{ github.run_number }}
          path: UNDO-*${{ github.run_number }}.apk
          retention-days: 30

      - name: Publish release (direct download for your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: undo-v0.1.${{ github.run_number }}
          name: UNDO v0.1.${{ github.run_number }}
          make_latest: 'true'
          body: |
            **UNDO — Ctrl+Z for your phone.** Android 8.0+.

            | File | Use it if |
            |---|---|
            | `UNDO-Lite-${{ github.run_number }}.apk` | **Start here.** Installs straight from your browser, even where Play Protect blocks sideloaded apps (e.g. India). No notification access, so no automatic payment / renewal / swiped-notification detection. Everything else works. |
            | `UNDO-${{ github.run_number }}.apk` | Full edition with notification access. Play Protect's fraud check blocks it when it's downloaded from a browser in some regions. See the README for options. |

            Both use the same app ID and signing key, so you can install one over the other.

            Privacy: UNDO declares no internet permission. Everything stays on your phone.

            Branch `${{ github.ref_name }}` · commit `${{ github.sha }}`
          files: |
            UNDO-${{ github.run_number }}.apk
            UNDO-Lite-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
